; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env]
#platform = https://github.com/platformio/platform-espressif32.git
platform = espressif32
framework = arduino, espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_raw = yes
build_unflags = -Werror=all
lib_deps = 
	bxparks/AceRoutine@^1.5.1
	bxparks/AceTimeClock@^1.2.3
	tinyu-zhao/TinyGPSPlus-ESP32@^0.0.2
	joba-1/Joba_Tsl2561@^2.0.10
	adafruit/Adafruit GFX Library@^1.11.5
	marcmerlin/FastLED NeoMatrix@^1.2
	bblanchon/ArduinoJson@^6.20.1
	prampec/IotWebConf@^3.2.1
lib_ldf_mode = chain
lib_ignore = 
	STM32Ethernet
	STM32duino LwIP
	Teensy41_AsyncTCP
	WebServer_WT32_ETH01
	STM32AsyncTCP
build_type = release
extra_scripts =
	pre:scripts/build_metadata.py
	post:scripts/post_build_artifacts.py

[env:esp32dev]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 40000000L
monitor_port = none
upload_port = /dev/ttyUSB0
debug_tool = esp-prog
#debug_init_break = tbreak
build_flags =
	-DLEDCLOCK_BOARD_PROFILE=\"esp32dev\"

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
build_flags =
	-DLEDCLOCK_BOARD_PROFILE=\"esp32doit-devkit-v1\"

[env:nodemcu-32s]
board = nodemcu-32s
build_flags =
	-DLEDCLOCK_BOARD_PROFILE=\"nodemcu-32s\"

[env:wemos_d1_mini32]
board = wemos_d1_mini32
build_flags =
	-DLEDCLOCK_BOARD_PROFILE=\"wemos_d1_mini32\"

[env:lolin32]
board = lolin32
build_flags =
	-DLEDCLOCK_BOARD_PROFILE=\"lolin32\"

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3"
build_flags =
	-DLEDCLOCK_BOARD_PROFILE=\"esp32-s3-devkitc-1\"
	-DLEDCLOCK_MAX_GPIO_PIN=48
	-DLEDCLOCK_DEFAULT_LED_DATA_PIN=33
	-DLEDCLOCK_DEFAULT_I2C_SDA_PIN=8
	-DLEDCLOCK_DEFAULT_I2C_SCL_PIN=9
